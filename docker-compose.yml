# docker-compose.yml — ¡A mi me gusta!
#
# Orquestra dois serviços:
#   api   — a API FastAPI com o modelo de ML
#   nginx — proxy reverso, único ponto de entrada público
#
# A API não usa banco de dados (dados em memória) —
# por isso não há serviço de PostgreSQL.
# Exercício 11.1 (compose mínimo) + Exercício 11.3 (Nginx)

services:

  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    # Constrói a imagem a partir do Dockerfile na raiz do projeto.
    # 'build: .' em vez de 'image:' porque é código nosso, não uma imagem pronta.
    build: .

    # A porta 8000 NÃO é exposta para o host.
    # O Nginx é o único ponto de entrada — a API fica na rede interna.
    # Para desenvolvimento direto sem Nginx: descomente a linha abaixo.
    # ports:
    #   - "8000:8000"

    # Carrega HF_TOKEN e demais variáveis do arquivo .env.
    # O .env nunca entra na imagem (está no .dockerignore) —
    # é injetado em runtime pelo Compose.
    env_file:
      - .env

    # A API depende do Nginx estar no ar? Não — é o Nginx que depende da API.
    # Sem depends_on aqui porque a API não tem dependências externas para subir.

  # ─── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    # Usa a imagem oficial Alpine do Nginx — leve (~25MB).
    image: nginx:alpine

    # Expõe a porta 80 para o host — único ponto de entrada público.
    ports:
      - "80:80"

    # Bind mount do arquivo de configuração.
    # Qualquer alteração no nginx.conf reflete sem rebuildar a imagem.
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    # O Nginx deve subir depois da API para poder rotear requisições.
    depends_on:
      - api

# Não há volumes declarados porque a API usa dados em memória.
# Se no futuro a API passar a usar banco ou armazenar arquivos,
# adicionar aqui:
# volumes:
#   dados:
