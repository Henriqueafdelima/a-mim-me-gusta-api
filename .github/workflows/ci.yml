# .github/workflows/ci.yml — Pipeline CI do ¡A mi me gusta!
#
# Exercício 2.3 (Caderno 3) → primeiro pipeline
# Exercício 3.1 (Caderno 4) → substituiu curl por pytest
# Exercício 4.4 (Caderno 4) → testes seletivos por marcador
# Exercício 5.1 (Caderno 5) → secret HF_TOKEN
# Exercício 5.4 (Caderno 5) → cache do Hugging Face
# Exercício 6.5 (Caderno 5) → pipeline final de 3 jobs

name: CI — ¡A mi me gusta!

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: qualidade
  # Roda em todo push e PR — feedback rápido, sem depender de recursos externos.
  # Requer: black e autoflake no requirements.txt
  # ───────────────────────────────────────────────────────────────────────────
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnóstico do ambiente
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Arquivos do projeto ==="
          test -f main.py          && echo "✅ main.py"          || echo "❌ main.py ausente"
          test -f requirements.txt && echo "✅ requirements.txt" || echo "❌ requirements.txt ausente"
          test -f model_utils.py   && echo "✅ model_utils.py"   || echo "❌ model_utils.py ausente"
          test -d tests/           && echo "✅ tests/"           || echo "❌ tests/ ausente"
          test -d routers/         && echo "✅ routers/"         || echo "❌ routers/ ausente"

      - name: Verificar formatação (black)
        run: black --check .

      - name: Verificar imports não utilizados (autoflake)
        run: autoflake --check --remove-all-unused-imports -r .

      - name: Rodar testes smoke
        run: pytest tests/ -m smoke -v --tb=short

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: integracao
  # Roda apenas em push para main, depois de qualidade passar.
  # Secrets não estão disponíveis em PRs de forks externos —
  # por isso este job é restrito a pushes diretos para main.
  # ───────────────────────────────────────────────────────────────────────────
  integracao:
    runs-on: ubuntu-latest
    needs: qualidade
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache do modelo Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Mude 'v1' para 'v2' ao publicar nova versão do modelo no Hub
          # — isso invalida o cache e força o download da versão nova.
          key: hf-model-v1-${{ hashFiles('requirements.txt') }}

      - name: Diagnóstico do ambiente (com HF_TOKEN)
        run: |
          python --version
          test -f model_utils.py && echo "✅ model_utils.py" || echo "❌ model_utils.py ausente"
          if [ -n "$HF_TOKEN" ]; then echo "✅ HF_TOKEN definido"; else echo "❌ HF_TOKEN ausente"; fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Verificar autenticação com Hugging Face
        run: python -c "import os; assert os.environ.get('HF_TOKEN'), 'HF_TOKEN não configurado'"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Rodar testes de integração
        run: pytest tests/ -m integracao -v --tb=short
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: relatorio
  # Roda após integração — em um projeto real seria deploy ou notificação.
  # Por ora exibe um resumo do pipeline concluído com sucesso.
  # ───────────────────────────────────────────────────────────────────────────
  relatorio:
    runs-on: ubuntu-latest
    needs: integracao
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Resumo do pipeline
        run: |
          echo "================================================"
          echo "  Pipeline CI do ¡A mi me gusta! concluído ✅"
          echo "================================================"
          echo "  Branch:  ${{ github.ref_name }}"
          echo "  Commit:  ${{ github.sha }}"
          echo "  Autor:   ${{ github.actor }}"
          echo "================================================"
          echo "  Próximo passo: configurar deploy automático"
          echo "================================================"
