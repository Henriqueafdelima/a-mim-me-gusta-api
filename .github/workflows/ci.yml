# .github/workflows/ci.yml — Pipeline CI do ¡A mi me gusta!
#
# Exercício 2.3 (Caderno 3) → primeiro pipeline
# Exercício 3.1 (Caderno 4) → substituiu curl por pytest
# Exercício 4.4 (Caderno 4) → testes seletivos por marcador
# Exercício 5.1 (Caderno 5) → secret HF_TOKEN
# Exercício 5.4 (Caderno 5) → cache do Hugging Face
# Exercício 6.5 (Caderno 5) → pipeline de 3 jobs
# Exercício 13.3 (Caderno Docker p03) → job docker + push para Docker Hub

name: CI — ¡A mi me gusta!

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: qualidade
  # Roda em todo push e PR — feedback rápido, sem depender de recursos externos.
  # ───────────────────────────────────────────────────────────────────────────
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnóstico do ambiente
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Arquivos do projeto ==="
          test -f main.py          && echo "✅ main.py"          || echo "❌ main.py ausente"
          test -f requirements.txt && echo "✅ requirements.txt" || echo "❌ requirements.txt ausente"
          test -f model_utils.py   && echo "✅ model_utils.py"   || echo "❌ model_utils.py ausente"
          test -f Dockerfile       && echo "✅ Dockerfile"       || echo "❌ Dockerfile ausente"
          test -d tests/           && echo "✅ tests/"           || echo "❌ tests/ ausente"
          test -d routers/         && echo "✅ routers/"         || echo "❌ routers/ ausente"

      - name: Rodar testes smoke
        run: pytest tests/ -m smoke -v --tb=short

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: integracao
  # Roda apenas em push para main, depois de qualidade passar.
  # Secrets não estão disponíveis em PRs de forks externos.
  # ───────────────────────────────────────────────────────────────────────────
  integracao:
    runs-on: ubuntu-latest
    needs: qualidade
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache do modelo Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-v1-${{ hashFiles('requirements.txt') }}

      - name: Diagnóstico do ambiente (com HF_TOKEN)
        run: |
          python --version
          test -f model_utils.py && echo "✅ model_utils.py" || echo "❌ model_utils.py ausente"
          if [ -n "$HF_TOKEN" ]; then echo "✅ HF_TOKEN definido"; else echo "❌ HF_TOKEN ausente"; fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Verificar autenticação com Hugging Face
        run: python -c "import os; assert os.environ.get('HF_TOKEN'), 'HF_TOKEN não configurado'"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Rodar testes de integração
        run: pytest tests/ -m integracao -v --tb=short
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: docker
  # Roda apenas em push para main, depois de integracao passar.
  # Lógica: se os testes passaram, o código e o modelo estão íntegros —
  # a imagem pode ser publicada com confiança.
  # Usa o hash do commit como tag para rastreabilidade total:
  # dada qualquer imagem em produção, você sabe exatamente qual commit a gerou.
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: integracao
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # BuildKit é o builder moderno do Docker.
      # Necessário para o cache de layers funcionar no CI.
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autentica no Docker Hub usando os secrets do repositório.
      # Nunca coloque usuário e senha diretamente no YAML.
      # DOCKER_PASSWORD deve ser um token de acesso (não a senha da conta) —
      # tokens são revogáveis individualmente sem afetar a conta.
      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build e push com duas tags:
      #   :sha-<commit>  — rastreabilidade: qual commit gerou esta imagem
      #   :latest        — conveniência: sempre aponta para a versão mais recente
      # cache-from/to: evita rebuildar layers que não mudaram entre execuções.
      # Na prática: se requirements.txt não mudou, o pip install usa cache
      # e o build leva segundos em vez de minutos.
      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/a-mi-me-gusta-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/a-mi-me-gusta-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: relatorio
  # Roda após docker — resumo com URL da imagem publicada.
  # Em um projeto real, aqui entraria o deploy automático.
  # ───────────────────────────────────────────────────────────────────────────
  relatorio:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Resumo do pipeline
        run: |
          echo "================================================"
          echo "  Pipeline CI do ¡A mi me gusta! concluído ✅"
          echo "================================================"
          echo "  Branch:  ${{ github.ref_name }}"
          echo "  Commit:  ${{ github.sha }}"
          echo "  Autor:   ${{ github.actor }}"
          echo "  Imagem:  ${{ secrets.DOCKER_USERNAME }}/a-mi-me-gusta-api:${{ github.sha }}"
          echo "================================================"
          echo "  Docker Hub: hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/a-mi-me-gusta-api"
          echo "  Próximo passo: deploy da imagem em produção"
          echo "================================================"
