server {
    # Nginx escuta na porta 80 (ponto de entrada público).
    # A API nunca é exposta diretamente — só via este proxy.
    listen 80;

    location / {
        # 'api' é o nome do serviço no docker-compose.yml.
        # O Docker Compose cria um DNS interno que resolve
        # nomes de serviços para os IPs dos contêineres.
        # 'localhost' NÃO funciona aqui — dentro do contêiner do Nginx,
        # localhost é o próprio Nginx, não a API.
        proxy_pass http://api:8000;

        # Repassa o host original para a API poder logar corretamente.
        proxy_set_header Host $host;

        # Repassa o IP real do cliente (não o IP interno do Nginx).
        proxy_set_header X-Real-IP $remote_addr;

        # Timeout maior para o endpoint /ml/predict,
        # que pode levar alguns segundos na primeira chamada
        # (download do modelo do Hugging Face Hub).
        proxy_read_timeout 120s;
    }
}
